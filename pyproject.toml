[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fider-ssrl-research"
version = "0.1.0"
description = "Audited FiDeR and signed Richardson-Lucy research cores"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fider_ssrl*"]
